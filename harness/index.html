<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>hermes-t3sidebar · Synthetic development harness</title>
<style>
/* Harness palette only. Production plugin styles use Hermes theme variables. */
:root{--ui-red:#f48771}
:root{color-scheme:dark;--ui-text-primary:#d9dadd;--ui-text-secondary:#b2b3ba;--ui-text-tertiary:#898b96;--ui-text-quaternary:#686b78;--ui-accent:#c7ae84;--ui-blue:#0053fd;--ui-green:#55a583;--ui-orange:#db704b;--ui-purple:#9e94d5;--ui-stroke-secondary:#303139;--ui-bg-tertiary:#222329;--ui-bg-quaternary:#282930;--ui-bg-elevated:#24252b;--chrome-action-hover:#2c2d35;--font-sans:Inter,ui-sans-serif,system-ui,sans-serif;font-family:var(--font-sans);background:#18191e;color:var(--ui-text-primary)}
*{box-sizing:border-box}body{margin:0}button{font:inherit;color:inherit}button:focus-visible{outline:2px solid var(--ui-accent)}.harness-app{height:100dvh;display:flex;flex-direction:column}.harness-top{height:40px;display:flex;align-items:center;padding:0 14px;gap:22px;border-bottom:1px solid var(--ui-stroke-secondary);font-size:11px;color:var(--ui-text-tertiary)}.harness-top strong{color:var(--ui-text-secondary);font-size:12px}.harness-body{display:flex;flex:1;min-height:0}.harness-sidebar{width:295px;flex-shrink:0;border-right:1px solid var(--ui-stroke-secondary);background:#1c1d22}.harness-main{flex:1;min-width:0;overflow:auto}.harness-tabs{height:40px;padding:12px 20px;border-bottom:1px solid var(--ui-stroke-secondary);font-size:12px;color:var(--ui-text-secondary)}.harness-content{max-width:760px;margin:70px auto;padding:0 40px}.harness-eyebrow{font-size:10px;letter-spacing:.15em;color:var(--ui-accent)}h1{font-size:30px;line-height:1.2;letter-spacing:-.035em;max-width:540px;font-weight:500}p{font-size:13px;line-height:1.8;color:var(--ui-text-tertiary)}.harness-card{margin:28px 0;padding:20px 24px;border:1px solid var(--ui-stroke-secondary);border-radius:8px;background:#1c1d23}h2{font-size:13px;font-weight:500;margin:0 0 12px}ul{padding-left:16px;margin:0}li{font-size:12px;line-height:2;color:var(--ui-text-secondary)}.harness-controls{display:flex;flex-wrap:wrap;gap:8px}.harness-controls button{padding:7px 10px;background:var(--ui-bg-quaternary);border:1px solid var(--ui-stroke-secondary);border-radius:4px;font-size:11px;cursor:pointer}.harness-footnote{font-size:11px;line-height:1.7}.mock-popover{position:absolute;z-index:3;left:260px;top:0;border:1px solid var(--ui-stroke-secondary);border-radius:6px;background:var(--ui-bg-elevated);box-shadow:0 10px 40px #0005}.mock-popover button{background:transparent;border:0;border-radius:3px;padding:6px;font-size:11px;cursor:pointer}.mock-popover button:hover{background:var(--ui-bg-quaternary)}.mock-popover button:disabled{opacity:.4;cursor:default}.mock-popover>button{margin:4px 10px;color:var(--ui-text-tertiary)}
.harness-route{display:flex;flex-direction:column;overflow:hidden}.harness-route .harness-tabs{display:flex;justify-content:space-between;align-items:center;flex-shrink:0;padding:0 20px}.harness-back{background:transparent;border:0;color:var(--ui-text-tertiary);font-size:11px;cursor:pointer}.harness-page{flex:1;min-height:0}
/* Stand-in for Desktop's SegmentedControl Tailwind classes (tinted track, raised active pill). */
.mock-segmented{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:2px;border-radius:5px;background:var(--ui-bg-tertiary)}.mock-segmented button{border:0;border-radius:3px;padding:2px 10px;font-size:11px;font-weight:500;background:transparent;color:var(--ui-text-tertiary);cursor:pointer}.mock-segmented button[aria-pressed=true]{background:#18191e;color:var(--ui-text-primary);box-shadow:0 1px 2px #0006}
/* Desktop's tooltip bubble (bg-foreground, text-background, 11px medium, 4px radius, 5px offset) for the SDK Tip adapter. */
.mock-tip{z-index:50;padding:4px 8px;border-radius:4px;background:var(--ui-text-primary);color:#18191e;font-size:11px;font-weight:500;line-height:1.4;white-space:nowrap;pointer-events:none;transform:translate(-50%,-100%)}.mock-tip[data-side=bottom]{transform:translate(-50%,0)}.mock-tip[data-side=left]{transform:translate(-100%,-50%)}.mock-tip[data-side=right]{transform:translate(0,-50%)}
.mock-tip::after{content:'';position:absolute;left:var(--mock-tip-arrow,50%);top:100%;margin-left:-5px;border:5px solid transparent;border-top-color:var(--ui-text-primary);border-bottom:0}.mock-tip:not([data-side=top])::after{display:none}
</style></head><body><div id="root"></div><script type="module" src="./app.bundle.js"></script></body></html>
